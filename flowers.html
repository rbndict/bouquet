<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bouquet</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            overflow: hidden;
        }

        #bouquet {
            position: absolute;
            top: 50%;
            left: 50%;
            width: min(90vmin, 700px);
            height: auto;
            filter: drop-shadow(0 15px 30px rgba(216, 27, 96, 0.35));
            z-index: 5;
            animation: float 5s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translate(-50%, -50%) translateY(0); }
            50%      { transform: translate(-50%, -50%) translateY(-14px); }
        }

        .sway {
            transform-origin: 300px 560px;
            animation: sway 4.5s ease-in-out infinite;
        }

        @keyframes sway {
            0%, 100% { transform: rotate(-1.5deg); }
            50%      { transform: rotate(1.5deg); }
        }

        .petal {
            position: absolute;
            width: 16px;
            height: 16px;
            background: #ffb6c1;
            border-radius: 15px 0;
            animation: fall linear infinite;
            opacity: 0.7;
            z-index: 1;
            box-shadow: inset 0 0 5px rgba(255, 105, 180, 0.5);
        }

        @keyframes fall {
            0%   { transform: translateY(-10vh) rotate(0deg) scale(0.5); opacity: 0; }
            10%  { opacity: 1; }
            100% { transform: translateY(110vh) rotate(360deg) scale(1.2); opacity: 0; }
        }
    </style>
</head>
<body>

    <svg id="bouquet" viewBox="0 0 600 700" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <radialGradient id="petalOuter" cx="50%" cy="40%" r="70%">
                <stop offset="0%"  stop-color="#ff8fab"/>
                <stop offset="70%" stop-color="#f2547d"/>
                <stop offset="100%" stop-color="#e0336b"/>
            </radialGradient>
            <radialGradient id="petalMid" cx="50%" cy="45%" r="70%">
                <stop offset="0%"  stop-color="#ffa8c5"/>
                <stop offset="100%" stop-color="#f76a93"/>
            </radialGradient>
            <radialGradient id="petalInner" cx="50%" cy="50%" r="70%">
                <stop offset="0%"  stop-color="#ffd0de"/>
                <stop offset="100%" stop-color="#ff8fb3"/>
            </radialGradient>
            <radialGradient id="budCore" cx="50%" cy="50%" r="60%">
                <stop offset="0%"  stop-color="#a3123f"/>
                <stop offset="100%" stop-color="#6d0a2a"/>
            </radialGradient>
            <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%"  stop-color="#5cb85c"/>
                <stop offset="100%" stop-color="#2e7d32"/>
            </linearGradient>
            <linearGradient id="stemGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%"  stop-color="#66bb6a"/>
                <stop offset="100%" stop-color="#2e7d32"/>
            </linearGradient>
            <linearGradient id="wrapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%"  stop-color="#fff3f6"/>
                <stop offset="100%" stop-color="#ffd9e2"/>
            </linearGradient>
            <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%"  stop-color="#f06292"/>
                <stop offset="100%" stop-color="#c2185b"/>
            </linearGradient>
        </defs>

        <g class="sway">
            <!-- Stems -->
            <g stroke="url(#stemGrad)" stroke-width="7" stroke-linecap="round" fill="none">
                <path d="M300,560 C300,470 290,380 300,300"/>
                <path d="M300,560 C280,470 240,380 210,330"/>
                <path d="M300,560 C320,470 360,380 390,330"/>
                <path d="M300,560 C290,480 250,430 205,395"/>
                <path d="M300,560 C310,480 350,430 395,395"/>
            </g>

            <!-- Leaves -->
            <g fill="url(#leafGrad)" stroke="#2e7d32" stroke-width="2">
                <path d="M255,470 C220,440 200,420 185,385 C225,395 250,425 258,465 Z"/>
                <path d="M345,470 C380,440 400,420 415,385 C375,395 350,425 342,465 Z"/>
                <path d="M262,520 C230,500 215,485 200,460 C235,465 255,490 264,515 Z"/>
                <path d="M338,520 C370,500 385,485 400,460 C365,465 345,490 336,515 Z"/>
            </g>

            <!-- Wrap paper -->
            <g>
                <path d="M215,470 L195,620 L405,620 L385,470 Q300,500 215,470 Z" fill="url(#wrapGrad)" stroke="#f8bbd0" stroke-width="2"/>
                <path d="M235,480 L225,615 M365,480 L375,615" stroke="#f8bbd0" stroke-width="2" fill="none"/>
            </g>

            <!-- Ribbon -->
            <g>
                <path d="M240,560 Q300,585 360,560 L366,590 Q300,615 234,590 Z" fill="url(#ribbonGrad)"/>
                <path d="M238,572 Q215,560 205,540 Q235,548 248,565 Z" fill="url(#ribbonGrad)"/>
                <path d="M362,572 Q385,560 395,540 Q365,548 352,565 Z" fill="url(#ribbonGrad)"/>
                <circle cx="300" cy="578" r="9" fill="#ec407a"/>
            </g>

            <!-- Rose template drawn five times -->
            <!-- Center rose -->
            <g transform="translate(300,250)">
                <g fill="url(#petalOuter)">
                    <ellipse cx="0" cy="-58" rx="26" ry="34"/>
                    <ellipse cx="44" cy="-30" rx="28" ry="36" transform="rotate(72 44 -30)"/>
                    <ellipse cx="28" cy="40" rx="28" ry="36" transform="rotate(144 28 40)"/>
                    <ellipse cx="-28" cy="40" rx="28" ry="36" transform="rotate(216 -28 40)"/>
                    <ellipse cx="-44" cy="-30" rx="28" ry="36" transform="rotate(288 -44 -30)"/>
                </g>
                <g fill="url(#petalMid)">
                    <ellipse cx="0" cy="-30" rx="20" ry="26"/>
                    <ellipse cx="24" cy="-6" rx="20" ry="26" transform="rotate(72 24 -6)"/>
                    <ellipse cx="10" cy="24" rx="20" ry="26" transform="rotate(144 10 24)"/>
                    <ellipse cx="-16" cy="20" rx="20" ry="26" transform="rotate(216 -16 20)"/>
                    <ellipse cx="-22" cy="-12" rx="20" ry="26" transform="rotate(288 -22 -12)"/>
                </g>
                <g fill="url(#petalInner)">
                    <ellipse cx="0" cy="-12" rx="14" ry="18"/>
                    <ellipse cx="12" cy="6" rx="13" ry="17" transform="rotate(120 12 6)"/>
                    <ellipse cx="-10" cy="8" rx="13" ry="17" transform="rotate(240 -10 8)"/>
                </g>
                <circle cx="0" cy="0" r="10" fill="url(#budCore)"/>
            </g>

            <!-- Left rose -->
            <g transform="translate(195,320) scale(0.85) rotate(-12)">
                <g fill="url(#petalOuter)">
                    <ellipse cx="0" cy="-58" rx="26" ry="34"/>
                    <ellipse cx="44" cy="-30" rx="28" ry="36" transform="rotate(72 44 -30)"/>
                    <ellipse cx="28" cy="40" rx="28" ry="36" transform="rotate(144 28 40)"/>
                    <ellipse cx="-28" cy="40" rx="28" ry="36" transform="rotate(216 -28 40)"/>
                    <ellipse cx="-44" cy="-30" rx="28" ry="36" transform="rotate(288 -44 -30)"/>
                </g>
                <g fill="url(#petalMid)">
                    <ellipse cx="0" cy="-30" rx="20" ry="26"/>
                    <ellipse cx="24" cy="-6" rx="20" ry="26" transform="rotate(72 24 -6)"/>
                    <ellipse cx="10" cy="24" rx="20" ry="26" transform="rotate(144 10 24)"/>
                    <ellipse cx="-16" cy="20" rx="20" ry="26" transform="rotate(216 -16 20)"/>
                    <ellipse cx="-22" cy="-12" rx="20" ry="26" transform="rotate(288 -22 -12)"/>
                </g>
                <g fill="url(#petalInner)">
                    <ellipse cx="0" cy="-12" rx="14" ry="18"/>
                    <ellipse cx="12" cy="6" rx="13" ry="17" transform="rotate(120 12 6)"/>
                    <ellipse cx="-10" cy="8" rx="13" ry="17" transform="rotate(240 -10 8)"/>
                </g>
                <circle cx="0" cy="0" r="10" fill="url(#budCore)"/>
            </g>

            <!-- Right rose -->
            <g transform="translate(405,320) scale(0.85) rotate(12)">
                <g fill="url(#petalOuter)">
                    <ellipse cx="0" cy="-58" rx="26" ry="34"/>
                    <ellipse cx="44" cy="-30" rx="28" ry="36" transform="rotate(72 44 -30)"/>
                    <ellipse cx="28" cy="40" rx="28" ry="36" transform="rotate(144 28 40)"/>
                    <ellipse cx="-28" cy="40" rx="28" ry="36" transform="rotate(216 -28 40)"/>
                    <ellipse cx="-44" cy="-30" rx="28" ry="36" transform="rotate(288 -44 -30)"/>
                </g>
                <g fill="url(#petalMid)">
                    <ellipse cx="0" cy="-30" rx="20" ry="26"/>
                    <ellipse cx="24" cy="-6" rx="20" ry="26" transform="rotate(72 24 -6)"/>
                    <ellipse cx="10" cy="24" rx="20" ry="26" transform="rotate(144 10 24)"/>
                    <ellipse cx="-16" cy="20" rx="20" ry="26" transform="rotate(216 -16 20)"/>
                    <ellipse cx="-22" cy="-12" rx="20" ry="26" transform="rotate(288 -22 -12)"/>
                </g>
                <g fill="url(#petalInner)">
                    <ellipse cx="0" cy="-12" rx="14" ry="18"/>
                    <ellipse cx="12" cy="6" rx="13" ry="17" transform="rotate(120 12 6)"/>
                    <ellipse cx="-10" cy="8" rx="13" ry="17" transform="rotate(240 -10 8)"/>
                </g>
                <circle cx="0" cy="0" r="10" fill="url(#budCore)"/>
            </g>

            <!-- Lower-left rose -->
            <g transform="translate(230,395) scale(0.7) rotate(-20)">
                <g fill="url(#petalOuter)">
                    <ellipse cx="0" cy="-58" rx="26" ry="34"/>
                    <ellipse cx="44" cy="-30" rx="28" ry="36" transform="rotate(72 44 -30)"/>
                    <ellipse cx="28" cy="40" rx="28" ry="36" transform="rotate(144 28 40)"/>
                    <ellipse cx="-28" cy="40" rx="28" ry="36" transform="rotate(216 -28 40)"/>
                    <ellipse cx="-44" cy="-30" rx="28" ry="36" transform="rotate(288 -44 -30)"/>
                </g>
                <g fill="url(#petalMid)">
                    <ellipse cx="0" cy="-30" rx="20" ry="26"/>
                    <ellipse cx="24" cy="-6" rx="20" ry="26" transform="rotate(72 24 -6)"/>
                    <ellipse cx="10" cy="24" rx="20" ry="26" transform="rotate(144 10 24)"/>
                    <ellipse cx="-16" cy="20" rx="20" ry="26" transform="rotate(216 -16 20)"/>
                    <ellipse cx="-22" cy="-12" rx="20" ry="26" transform="rotate(288 -22 -12)"/>
                </g>
                <circle cx="0" cy="0" r="12" fill="url(#budCore)"/>
            </g>

            <!-- Lower-right rose -->
            <g transform="translate(370,395) scale(0.7) rotate(20)">
                <g fill="url(#petalOuter)">
                    <ellipse cx="0" cy="-58" rx="26" ry="34"/>
                    <ellipse cx="44" cy="-30" rx="28" ry="36" transform="rotate(72 44 -30)"/>
                    <ellipse cx="28" cy="40" rx="28" ry="36" transform="rotate(144 28 40)"/>
                    <ellipse cx="-28" cy="40" rx="28" ry="36" transform="rotate(216 -28 40)"/>
                    <ellipse cx="-44" cy="-30" rx="28" ry="36" transform="rotate(288 -44 -30)"/>
                </g>
                <g fill="url(#petalMid)">
                    <ellipse cx="0" cy="-30" rx="20" ry="26"/>
                    <ellipse cx="24" cy="-6" rx="20" ry="26" transform="rotate(72 24 -6)"/>
                    <ellipse cx="10" cy="24" rx="20" ry="26" transform="rotate(144 10 24)"/>
                    <ellipse cx="-16" cy="20" rx="20" ry="26" transform="rotate(216 -16 20)"/>
                    <ellipse cx="-22" cy="-12" rx="20" ry="26" transform="rotate(288 -22 -12)"/>
                </g>
                <circle cx="0" cy="0" r="12" fill="url(#budCore)"/>
            </g>
        </g>
    </svg>

    <script>
        function createPetal() {
            const petal = document.createElement('div');
            petal.classList.add('petal');
            petal.style.left = Math.random() * 100 + 'vw';
            petal.style.animationDuration = Math.random() * 5 + 5 + 's';
            petal.style.background = Math.random() > 0.5 ? '#ffb6c1' : '#ffc0cb';
            document.body.appendChild(petal);
            setTimeout(() => petal.remove(), 10000);
        }
        setInterval(createPetal, 300);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Bouquet For You</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
    <style>
        body {
            /* Pink gradient background */
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Poppins', sans-serif;
            margin: 0;
            overflow: hidden;
            position: relative;
        }

        /* Glassmorphism Card */
        .glass-card {
            background: rgba(255, 255, 255, 0.25);
            box-shadow: 0 8px 32px 0 rgba(255, 105, 180, 0.3);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            padding: 3rem 2rem;
            text-align: center;
            max-width: 450px;
            width: 90%;
            z-index: 10;
        }

        .rose-img {
            width: 220px;
            height: 220px;
            object-fit: cover;
            border-radius: 50%;
            border: 5px solid rgba(255, 255, 255, 0.7);
            margin-bottom: 25px;
            box-shadow: 0 10px 25px rgba(255, 105, 180, 0.4);
            transition: transform 0.3s ease;
        }

        .rose-img:hover {
            transform: scale(1.05);
        }

        h1 {
            color: #d81b60;
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            margin-bottom: 15px;
        }

        p {
            color: #ad1457;
            font-size: 1.1rem;
            font-weight: 500;
            line-height: 1.6;
        }

        .btn-glass {
            background: rgba(255, 255, 255, 0.4);
            color: #d81b60;
            border: 2px solid rgba(255, 255, 255, 0.7);
            border-radius: 30px;
            padding: 12px 35px;
            font-weight: 700;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 105, 180, 0.2);
        }

        .btn-glass:hover {
            background: rgba(255, 255, 255, 0.8);
            color: #c2185b;
            transform: translateY(-2px);
        }

        /* Animated Falling Petals */
        .petal {
            position: absolute;
            width: 18px;
            height: 18px;
            background: #ffb6c1;
            border-radius: 15px 0px;
            animation: fall linear infinite;
            opacity: 0.7;
            z-index: 1;
            box-shadow: inset 0 0 5px rgba(255, 105, 180, 0.5);
        }

        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg) scale(0.5); opacity: 0; }
            10% { opacity: 1; }
            100% { transform: translateY(110vh) rotate(360deg) scale(1.2); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="glass-card">
        <!-- High-quality Unsplash image of a pink rose bouquet -->
        <img src="https://images.unsplash.com/photo-1562690868-60bbe7293e94?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80" alt="Pink Rose Bouquet" class="rose-img">
        
        <h1>For You, My Love</h1>
        <p>A virtual bouquet of roses to brighten your day and remind you how incredibly special you are to me. I love you!</p>
        
        <button class="btn btn-glass mt-3" onclick="triggerLove()">Open Surprise</button>
        <div id="surprise-text" class="mt-3 fw-bold" style="color: #d81b60; display: none;">
             💖
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // Reveal surprise text
        function triggerLove() {
            document.getElementById('surprise-text').style.display = 'block';
        }

        // Generate falling rose petals
        function createPetal() {
            const petal = document.createElement('div');
            petal.classList.add('petal');
            
            // Randomize position, size, and animation duration
            petal.style.left = Math.random() * 100 + 'vw';
            petal.style.animationDuration = Math.random() * 5 + 5 + 's'; // 5 to 10 seconds
            petal.style.background = Math.random() > 0.5 ? '#ffb6c1' : '#ffc0cb'; // Mix of pinks
            
            document.body.appendChild(petal);
            
            // Remove petal after it falls to prevent lag
            setTimeout(() => {
                petal.remove();
            }, 10000);
        }

        // Create a new petal every 300 milliseconds
        setInterval(createPetal, 300);
    </script>
</body>
</html>
